databaseChangeLog:
  - changeSet:
      id: 1
      author: caiopeia
      changes:
        - createTable:
            tableName: trip
            columns:
              - column:
                  name: id
                  type: serial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: trip_pkey
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(999)
  - changeSet:
      id: 2
      author: caiopeia
      changes:
        - loadData:
            encoding: UTF-8
            relativeToChangelogFile: true
            file: 001_trip.csv
            separator: ;
            tableName: trip
