databaseChangeLog:
  - changeSet:
      id: 1
      author: stefan.illgen@volkswagen.de
      changes:
        - createTable:
            tableName: trip
            columns:
              - column:
                  name: id
                  type: serial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: trip_pkey
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(999)
